<!DOCTYPE html>

<head>

    <title>Gerador de Tabuada</title>
</head>
<body>

      <h1>Gerador de Tabuada</h1>

    <div class="tabuada">
        <label for="numero">Digite um número</label>
        <input type="number" id="fator1"
        placeholder="Ex: 5">

        <button onclick="gerarTabuadaFor()">
        Gerar com FOR
        </button>

        <button onclick="gerarTabuadaWhile()">
        Gerar com WHILE
        </button>
        
    </div>


    <div id="resultado"></div>


    <script src="./js/script.js"></script>
    
</body>
</html>
